[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-code-py"
version = "0.1.0"
description = "nano-code (TypeScript) を参考に実装した、最小構成のコーディングエージェント Python 版"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.60.0,<1.0.0",
    "openai>=1.50.0,<4.0.0",
    "google-genai>=2.0.0,<3.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
